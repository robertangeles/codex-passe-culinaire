      <ellipse cx="804" cy="329" rx="32" ry="12"/><ellipse cx="804" cy="329" rx="25" ry="8"/>
      <ellipse cx="894" cy="329" rx="32" ry="12"/><ellipse cx="894" cy="329" rx="25" ry="8"/>
      <ellipse cx="984" cy="329" rx="32" ry="12"/><ellipse cx="984" cy="329" rx="25" ry="8"/>

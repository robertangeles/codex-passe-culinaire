<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="kitchen-title kitchen-description" data-stage="0">
  <title id="kitchen-title">A pastry kitchen through the working day</title>
  <desc id="kitchen-description">A fine-line kitchen elevation showing receiving, cool storage, recipe planning, pastry preparation, service at the pass, and a closing ledger.</desc>
  <style>
    .ink { fill: none; stroke: #e9e2d4; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
    .fine { fill: none; stroke: #bdb6a9; stroke-width: .8; stroke-linecap: round; stroke-linejoin: round; }
    .quiet { fill: none; stroke: #817d72; stroke-width: .8; stroke-linecap: round; stroke-linejoin: round; }
    .warm { fill: none; stroke: #bf795d; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .surface { fill: #24251f; stroke: #928b7e; stroke-width: 1; stroke-linejoin: round; }
    .shadow-surface { fill: #1b1c18; stroke: #777368; stroke-width: .8; stroke-linejoin: round; }
    .paper { fill: #e9e2d4; stroke: #e9e2d4; stroke-width: .8; stroke-linejoin: round; }
    .paper-line { fill: none; stroke: #57564e; stroke-width: .8; stroke-linecap: round; }
    .copper-fill { fill: #9d604b; stroke: #d19a7a; stroke-width: .9; }
    .glass { fill: #34362f; fill-opacity: .76; stroke: #aaa294; stroke-width: .8; }
    .common { opacity: 1; }
    .station { opacity: .34; transition: opacity 240ms ease; }
    [data-stage="0"] #station-plan,
    [data-stage="1"] #station-receiving,
    [data-stage="2"] #station-prep,
    [data-stage="3"] #station-service,
    [data-stage="4"] #station-close { opacity: 1; }
    [data-stage="0"] #station-plan .accent,
    [data-stage="1"] #station-receiving .accent,
    [data-stage="2"] #station-prep .accent,
    [data-stage="3"] #station-service .accent,
    [data-stage="4"] #station-close .accent { stroke: #d08a69; }
    .transfer-crate { opacity: .34; transform-box: view-box; transform-origin: 0 0; transition: opacity 240ms ease; }
    [data-stage="1"] #transfer-crate,
    [data-stage="2"] #transfer-crate { opacity: 1; }
    [data-stage="2"] #transfer-crate { transform: translateX(340px); }
    .transfer-active { animation: crate-travel 900ms cubic-bezier(.2,.72,.26,1) 1 both; }
    @keyframes crate-travel {
      from { transform: translateX(0); }
      to { transform: translateX(340px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .station, .transfer-crate { transition: none; }
      [data-stage="2"] #transfer-crate { transform: translateX(340px); }
    .transfer-active { animation: none; transform: translateX(340px); }
    }
  </style>

  <rect width="1100" height="640" fill="#23251f" aria-hidden="true"/>

  <g class="common" aria-hidden="true">
    <!-- A quiet, continuous room shell: tiled wall, hanging rail and stone floor. -->
    <path class="ink" d="M28 91V518H1072V91M28 121H1072M28 463H1072"/>
    <path class="quiet" d="M28 159H1072M28 197H1072M28 235H1072"/>
    <path class="quiet" d="M102 121V250M176 121V250M250 121V250M324 121V250M398 121V250M472 121V250M546 121V250M620 121V250M694 121V250M768 121V250M842 121V250M916 121V250M990 121V250"/>
    <path class="ink" d="M28 518H1072M28 526H1072M62 527l-20 29m144-29-17 29m142-29-13 29m142-29-9 29m142-29-5 29m142-29 1 29m142-29 5 29m142-29 9 29m142-29 13 29m142-29 17 29"/>
    <path class="quiet" d="M28 91h1044M65 91V76h70v15m122 0V76h70v15m122 0V76h70v15m122 0V76h70v15m122 0V76h70v15m122 0V76h70v15"/>
    <!-- Pendant task lights and the slender overhead service rail. -->
    <path class="fine" d="M690 77v39m-5 0h10m172-39v39m-5 0h10m173-39v39m-5 0h10"/>
    <path class="warm" d="M679 116h23m160 0h23m161 0h23"/>
    <path class="quiet" d="M715 135v294m174-294v294m173-294v294"/>
    <!-- Plinth and cabinet rhythm anchor the separate work areas as one kitchen. -->
    <path class="ink" d="M47 430H1054v80H47zM47 510H1054M47 497H1054"/>
    <path class="fine" d="M59 444h90v54H59zm102 0h90v54h-90zm102 0h90v54h-90zm102 0h90v54h-90zm102 0h90v54h-90zm102 0h90v54h-90zm102 0h90v54h-90zm102 0h90v54h-90zm102 0h90v54h-90zm102 0h23v54h-23"/>
    <path class="quiet" d="M104 467h8m93 0h8m94 0h8m93 0h8m93 0h8m94 0h8m93 0h8m94 0h8m93 0h8"/>
  </g>

  <g id="station-plan" class="station" aria-label="Menu and recipe planning">

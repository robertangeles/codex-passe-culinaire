    <path class="paper-line" d="M959 191l36-3m-35 11 39-3m-38 11 28-2"/>
    <path class="warm" d="M963 214c7-7 13-5 16 1 7-10 12-10 17-8"/>
    <!-- Utensils rest within reach, never as decorative clip-art. -->
    <path class="fine" d="M1021 164v73m-5-73v19m5-19v19m5-19v19m-5 0v54m11-54c-10 0-10-21-2-21 8 0 8 21-2 21"/>

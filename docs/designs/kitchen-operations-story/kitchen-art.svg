      <path d="M887 327c-4-7-1-13 5-13 6 4 6 9 2 13m-5 1c3-3 6-3 10 0"/>
      <path d="M977 327c-4-7-1-13 5-13 6 4 6 9 2 13m-5 1c3-3 6-3 10 0"/>
    </g>
    <!-- A roster sheet and a small handover note live near the pass. -->
    <path class="paper" d="M771 173h67v68h-67z"/>

      <path d="M598 274h20m9 0h20m9 0h20"/>
    </g>
    <!-- Pastry cloth and a small ingredient ramekin. -->
    <path class="fine" d="M687 301c14-7 26-4 34 8l-7 13h-35z"/>
    <path class="surface" d="M673 294h25l-3 9h-19z"/>
    <ellipse class="fine" cx="685" cy="294" rx="12" ry="4"/>
    <path class="warm" d="M680 293c3-3 8-3 11 0"/>
    <!-- Hanging pans and a folded towel. -->
    <path class="fine" d="M432 129v26m-11 0c0 13 22 13 22 0m-11 0v8m34-34v25m-10 0c0 12 20 12 20 0m-10 0v9"/>
    <path class="ink" d="M420 167h25m26-1h22m-31 1v7"/>
    <path class="fine" d="M691 191h28v29h-28zm5 0v29m19-29v29m-19-15h19"/>
    <path class="warm" d="M699 197v17m9-17v17"/>
  </g>

  <g id="station-service" class="station" aria-label="Service at the kitchen pass">

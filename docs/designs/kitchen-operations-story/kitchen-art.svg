    <path class="surface" d="M272 276h159v10H272zM282 285h9v33h-9zm132 0h9v33h-9z"/>
    <path class="paper" d="M300 199l47-10 20 75-47 10z"/>
    <path class="paper" d="M347 189l48-8 14 76-42 7z"/>
    <path class="paper-line" d="M308 208l27-6m-23 14 30-7m-26 16 30-7m-26 16 32-7m-27 17 31-7m-17-43 34-6m-30 14 30-5m-26 15 30-5m-26 14 31-5m-26 14 27-4"/>
    <path class="paper-line" d="M335 200l4 3 6-8m8 41 5 3 6-9m-42 1 8 1m52-27 20-3"/>
    <!-- Menu card, copper pin, pencilled cost marks. -->
    <path class="paper" d="M369 208l47-8 11 62-47 8z"/>
    <path class="paper-line" d="M377 220l28-5m-26 13 31-5m-29 14 26-4m-24 13 31-5m-26 13 20-3"/>
    <circle class="copper-fill" cx="407" cy="204" r="3"/>
    <path class="warm accent" d="M319 181c17-12 38-16 58-13m-59 0 4 13m-4-13 13 2"/>
    <path class="quiet" d="M282 332h132m-130 8h47m-47 8h75"/>
  </g>


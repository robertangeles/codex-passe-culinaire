    <path class="surface" d="M414 323h320v17H414zM425 340h16v90h-16zm282 0h16v90h-16z"/>
    <path class="ink" d="M452 359h87v57h-87zm104 0h111v57H556z"/>
    <path class="fine" d="M482 376h27m-14-4v8m116-3h21"/>
    <path class="quiet" d="M468 429h247"/>

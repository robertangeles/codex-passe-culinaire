    <path class="ink" d="M157 172h125m-125 53h125m-125 4h125"/>
    <g class="fine">
      <path d="M166 148h22v22h-22zm3-7h16v7h-16m-2 21h20"/>
      <path d="M194 155h19v15h-19zm2-6h15v6h-15m-1 15h17"/>
      <path d="M219 144h24v26h-24zm4-8h16v8h-16m-3 26h22"/>
      <path d="M251 151h23v19h-23zm3-7h17v7h-17m-2 19h21"/>
      <path d="M166 200h22v22h-22zm3-7h16v7h-16m-2 22h20"/>
      <path d="M195 204h19v18h-19zm2-7h15v7h-15m-1 18h17"/>
      <path d="M222 197h22v25h-22zm3-7h16v7h-16m-2 25h20"/>
      <path d="M252 201h22v21h-22zm3-7h16v7h-16m-2 21h20"/>
    </g>
    <path class="warm" d="M177 151v15m54-19v19m52 42v18"/>
    <path class="fine" d="M287 134v46m-4 0c0 7 8 7 8 0m-4-46v-8"/>
  </g>

  <g id="station-prep" class="station" aria-label="Pastry preparation and mise en place">

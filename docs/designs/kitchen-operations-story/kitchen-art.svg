    <path class="warm" d="M850 105v34m-29 0h58l-8 15h-42z"/>
    <path class="fine" d="M830 154c5 13 8 25 9 37m30-37c-5 13-8 25-9 37"/>
    <path class="quiet" d="M826 196h38"/>

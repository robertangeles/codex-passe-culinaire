name: Application quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [integration, browser, performance]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          sudo pg_createcluster 16 passe-ci --port 55432 --start
          npm install --global pnpm@11.1.3
          pnpm --version
      - name: Install locked application packages
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated databases and private fixture configuration
        run: node scripts/setup-ci.mjs
      - name: Migrate and seed application fixture
        run: |
          pnpm migrate
          pnpm seed
      - name: Integration gate
        if: matrix.check == 'integration'
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Install Chromium
        if: matrix.check != 'integration'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install pinned Caddy for deployment-path measurement
        if: matrix.check == 'performance'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/caddy-download .local/bin
          gh release download v2.11.4 --repo caddyserver/caddy --pattern caddy_2.11.4_linux_amd64.tar.gz --pattern caddy_2.11.4_checksums.txt --dir .local/caddy-download
          cd .local/caddy-download
          sha256sum --check --ignore-missing caddy_2.11.4_checksums.txt
          tar -xzf caddy_2.11.4_linux_amd64.tar.gz -C ../bin caddy
          ../bin/caddy version
      - name: Browser gate
        if: matrix.check == 'browser'
        run: pnpm test:e2e
      - name: Mobile performance gate
        if: matrix.check == 'performance'
        run: pnpm test:performance
      - name: Retain isolated quality evidence
        if: always() && matrix.check != 'integration'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-${{ matrix.check }}
          path: |
            .local/playwright-report
            .local/playwright-results
            .local/lighthouse-report
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
